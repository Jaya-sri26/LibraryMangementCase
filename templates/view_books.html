{% extends "base.html" %}
{% block content %}
<h2>Book Catalogue</h2>
<table>
    <tr><th>ID</th><th>Title</th><th>Author</th><th>Status</th><th>Action</th></tr>
    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ "Available" if book.available else "Borrowed" }}</td>
        <td><a href="{{ url_for('toggle_availability', book_id=book.id) }}">Toggle</a></td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
