{% extends "base.html" %}
{% block content %}
<h2>Add a New Book</h2>
<form method="POST">
    <label>Title: <input type="text" name="title" required></label>
    <br><br>
    <label>Author: <input type="text" name="author" required></label>
    <br><br>
    <button type="submit" style="background-color: #2c3e50;">Add Book</button>
</form>
{% endblock %}
