{% extends "base.html" %}
{% block content %}
<h2>Welcome to the Library</h2>
<div class="cards">
    <!-- Clicking this goes to All Books -->
    <a href="{{ url_for('view_books') }}" class="card-link">
        <div class="card">
            <h3>Total Books</h3>
            <p>{{ total }}</p>
        </div>
    </a>

    <!-- Clicking this goes to Available Books -->
    <a href="{{ url_for('view_available') }}" class="card-link">
        <div class="card">
            <h3>Available Now</h3>
            <p>{{ available }}</p>
        </div>
    </a>

    <!-- Visual Only Card for Borrowed -->
    <div class="card" style="cursor: default;">
        <h3>Borrowed Books</h3>
        <p>{{ borrowed }}</p>
    </div>
</div>
{% endblock %}
