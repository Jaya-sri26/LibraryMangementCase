{% extends "base.html" %}
{% block content %}
<h2>Welcome to the Library</h2>
<p>Automated CI/CD demo on port 5001.</p>

<div class="cards">
    <!-- Clicking this goes to All Books -->
    <a href="{{ url_for('view_books') }}" class="card-link">
        <div class="card">
            <h3>Total Books</h3>
            <p>{{ total }}</p>
        </div>
    </a>

    <!-- Clicking this goes to Available Books -->
    <a href="{{ url_for('view_available') }}" class="card-link">
        <div class="card">
            <h3>Available Now</h3>
            <p>{{ available }}</p>
        </div>
    </a>

    <!-- Added a new card for Borrowed Books -->
    <a href="{{ url_for('view_borrowed') }}" class="card-link">
        <div class="card">
            <h3>Borrowed Books</h3>
            <p>{{ total - available }}</p>
        </div>
    </a>
</div>
{% endblock %}
